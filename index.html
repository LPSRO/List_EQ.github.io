<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipment Loan System (Pro)</title>

https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>

<style>
body{font-family:system-ui;background:#f2f2f2;padding:10px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
button{padding:10px;border-radius:12px;border:none;background:#007aff;color:#fff}
input{width:100%;padding:8px;margin:5px 0;border-radius:10px;border:1px solid #ccc}
.table{width:100%;font-size:14px}

canvas{border:1px solid #ccc;border-radius:10px;width:100%;height:150px}
</style>
</head>
<body>

<div class="card">
<h3>📋 Event Info</h3>
<input id="eventName" placeholder="Event Name">
<input id="location" placeholder="Location">
<input type="date" id="date">
</div>

<div class="card">
<h3>📷 Scanner</h3>
<div id="reader" style="width:100%"></div>
<button onclick="startScan()">Start</button>
<button onclick="stopScan()">Stop</button>
<p id="status">Ready</p>
</div>

<div class="card">
<h3>✅ Items (<span id="count">0</span>)</h3>
<table class="table" id="table"></table>
<button onclick="exportCSV()">Export CSV</button>
<button onclick="clearAll()">Clear</button>
</div>

<div class="card">
<h3>✍️ Signature</h3>
<canvas id="sig"></canvas>
<button onclick="clearSig()">Clear Signature</button>
</div>

<div class="card">
<button onclick="submitAll()">✅ Confirm & Upload</button>
</div>

<script>
let items=[];
let scanner;
let lastScan=0;
let pad;

function resizeCanvas(){
 const canvas=document.getElementById("sig");
 const ratio=window.devicePixelRatio||1;
 canvas.width=canvas.offsetWidth*ratio;
 canvas.height=canvas.offsetHeight*ratio;
 canvas.getContext("2d").scale(ratio,ratio);
}

function init(){
 resizeCanvas();
 pad=new SignaturePad(document.getElementById("sig"));
 loadLocal();
 render();
}

function startScan(){
 scanner=new Html5Qrcode("reader");
 scanner.start({facingMode:"environment"}, {fps:10}, onScan);
}

function stopScan(){
 if(scanner)scanner.stop();
}

function onScan(text){
 if(Date.now()-lastScan<1500)return;
 lastScan=Date.now();

 if(items.find(i=>i.code===text.toLowerCase())){
 alert("Duplicate");
 return;
 }

 items.push({code:text,name:"Item"});
 saveLocal();
 render();
 navigator.vibrate?.(100);
}

function render(){
 const tbody=document.getElementById("table");
 tbody.innerHTML="";
 items.forEach((i,idx)=>{
 tbody.innerHTML+=`<tr><td>${idx+1}</td><td>${i.code}</td></tr>`;
 });
 document.getElementById("count").innerText=items.length;
}

function exportCSV(){
 let csv="Code\n";
 items.forEach(i=>csv+=i.code+"\n");
 const blob=new Blob([csv]);
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="items.csv";
 a.click();
}

function clearAll(){
 items=[];
 saveLocal();
 render();
}

function saveLocal(){
 localStorage.setItem("items",JSON.stringify(items));
}

function loadLocal(){
 const d=localStorage.getItem("items");
 if(d)items=JSON.parse(d);
}

function clearSig(){pad.clear();}

async function submitAll(){
 const data={
 event:document.getElementById("eventName").value,
 items
 };

 console.log("UPLOAD:",data);
 alert("Pretend uploaded (connect Power Automate)");
}

window.onload=init;
</script>

</body>
</html>
